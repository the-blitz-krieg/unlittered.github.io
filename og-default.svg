<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" fill="none">
  <!-- Background -->
  <rect width="1200" height="630" fill="#080808"/>

  <!-- Subtle grid -->
  <defs>
    <pattern id="grid" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M 80 0 L 0 0 0 80" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow" cx="65%" cy="30%" r="55%">
      <stop offset="0%" stop-color="#c9a96e" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#080808" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- Gold top border line -->
  <rect x="80" y="80" width="1040" height="1.5" fill="#c9a96e" opacity="0.6"/>

  <!-- Gold left accent bar -->
  <rect x="80" y="80" width="3" height="470" fill="#c9a96e" opacity="0.8"/>

  <!-- Eyebrow label -->
  <text
    x="104"
    y="136"
    font-family="Arial, Helvetica, sans-serif"
    font-size="13"
    font-weight="600"
    fill="#c9a96e"
    letter-spacing="3">HALIFAX, CANADA</text>

  <!-- Main headline -->
  <text
    x="104"
    y="240"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="72"
    font-weight="700"
    fill="#f5f4ef"
    letter-spacing="-2">Nivin Xavier</text>

  <!-- Sub headline line 1 -->
  <text
    x="104"
    y="308"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="28"
    font-style="italic"
    font-weight="400"
    fill="#c9a96e"
    letter-spacing="0">Entrepreneur. Marketer. Builder.</text>

  <!-- Descriptor -->
  <text
    x="104"
    y="374"
    font-family="Arial, Helvetica, sans-serif"
    font-size="17"
    fill="#999991"
    letter-spacing="0.3">Serial founder and digital marketing consultant. 15 years. Startups to Fortune 500.</text>

  <!-- Divider -->
  <rect x="104" y="418" width="240" height="1" fill="#3a3a34"/>

  <!-- Stats row -->
  <text x="104" y="460" font-family="Georgia, 'Times New Roman', serif" font-size="32" font-weight="700" fill="#f5f4ef">15+</text>
  <text x="104" y="490" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#6b6b65" letter-spacing="1.5">YEARS</text>

  <text x="220" y="460" font-family="Georgia, 'Times New Roman', serif" font-size="32" font-weight="700" fill="#f5f4ef">4</text>
  <text x="220" y="490" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#6b6b65" letter-spacing="1.5">VENTURES</text>

  <text x="310" y="460" font-family="Georgia, 'Times New Roman', serif" font-size="32" font-weight="700" fill="#f5f4ef">90+</text>
  <text x="310" y="490" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#6b6b65" letter-spacing="1.5">TEAM MEMBERS</text>

  <!-- URL bottom right -->
  <text
    x="1120"
    y="545"
    font-family="Arial, Helvetica, sans-serif"
    font-size="14"
    fill="#6b6b65"
    text-anchor="end"
    letter-spacing="1">unlittered.com</text>

  <!-- Bottom border -->
  <rect x="80" y="550" width="1040" height="1.5" fill="#c9a96e" opacity="0.3"/>

  <!-- NX monogram top right -->
  <rect x="1080" y="80" width="60" height="60" rx="4" fill="#0e0e0e" stroke="#c9a96e" stroke-width="1.5"/>
  <text
    x="1110"
    y="122"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="24"
    font-weight="700"
    fill="#c9a96e"
    text-anchor="middle"
    letter-spacing="-0.5">NX</text>
</svg>
